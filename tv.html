<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="#8b63a6" name="theme-color"/>
<link href="logo.png" rel="icon" type="image/png"/>
<script src="gas-shim.js"></script>
<title>ร้านสหกรณ์ มช. (CMU CO-OP)</title>
<link href="fonts.css" rel="stylesheet"/>
<style>
  /* ===== ปรับขนาด/สีได้ตรงนี้ ===== */
  :root { --bg:#8b63a6; --tv-fg:#ffffff; --btn-bg:rgba(26,15,46,.48); --btn-hover:rgba(26,15,46,.68); --btn-border:rgba(255,255,255,.78);
          --w:760px; --banner-h:230px; --receiver-h:430px; --gap:14px; --pad-top:14px; --logo:84px; --head-gap:18px; --banner-w:100%; --receiver-w:100%; --font:'Sarabun';
          --f-clock:22px; --f-shop:22px; --f-hello:22px; --f-caption:22px; --cap-speed:80; }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { background:var(--bg); color:var(--tv-fg); font-family:var(--font),'Sarabun','Noto Sans Thai',Tahoma,sans-serif; min-height:100vh;
         padding:max(var(--pad-top),env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom)); }
  .wrap { max-width:var(--w); margin:0 auto; display:flex; flex-direction:column; gap:0; }
  .wrap > * + * { margin-top:var(--gap); }
  #banner { margin-top:var(--g-banner,var(--gap)); } #caption { margin-top:var(--g-caption,var(--gap)); }
  #receiver { margin-top:var(--g-receiver,var(--gap)); } .foot { margin-top:var(--g-foot,var(--gap)); }

  .head { display:flex; align-items:center; justify-content:center; gap:var(--head-gap); flex-wrap:wrap; text-align:center; }
  /* รูปแบบการเรียงแถวบน: side | stack | row | topRow */
  .head[data-layout="stack"]  { flex-direction:column; }
  .head[data-layout="row"]    { flex-wrap:nowrap; }
  .head[data-layout="row"] .txt, .head[data-layout="topRow"] .txt { display:flex; flex-wrap:wrap; justify-content:center; align-items:baseline; gap:4px 22px; }
  .head[data-layout="topRow"] { flex-direction:column; }
  .logo { width:var(--logo); height:var(--logo); border-radius:50%; background:#fff; object-fit:cover; flex:none; box-shadow:0 2px 10px rgba(58,32,80,.25); }
  .txt { display:grid; gap:2px; font-weight:700; text-shadow:var(--tv-shadow,0 1px 2px rgba(58,32,80,.35)); }
  .clock { color:var(--tv-clock,var(--tv-fg)); font-size:var(--f-clock); font-variant-numeric:tabular-nums; }
  .shop  { color:var(--tv-shop,var(--tv-fg)); font-size:var(--f-shop); margin:0; font-weight:700; }
  .hello { font-size:var(--f-hello); }
  #helloMain { color:var(--tv-welcome,var(--tv-fg)); }
  .hello small { color:var(--tv-sub,var(--tv-fg)); font-size:.65em; font-weight:600; }

  .frame { width:100%; max-width:100%; margin-left:auto; margin-right:auto; border:0; display:block; border-radius:14px; background:#fff; }
  #banner { width:var(--banner-w); height:var(--banner-h); background:transparent; }
  #receiver { width:var(--receiver-w); height:var(--receiver-h); border-radius:16px; }
  /* ข้อความใต้แบนเนอร์: มีข้อความเดียว ไหลจากขอบขวาออกขอบซ้ายแล้วเริ่มใหม่ */
  .caption { color:var(--tv-caption,var(--tv-fg)); overflow:hidden; white-space:nowrap; font-size:var(--f-caption); font-weight:700; line-height:1.5;
             text-shadow:var(--tv-shadow,0 1px 2px rgba(58,32,80,.35)); }
  .caption .track { display:inline-block; will-change:transform; animation:marq linear infinite; animation-duration:var(--dur,20s); }
  .caption.paused .track { animation-play-state:paused !important; }
  @keyframes marq { from { transform:translateX(var(--cw,100%)); } to { transform:translateX(-100%); } }
  @media (prefers-reduced-motion:reduce) {
    .caption { white-space:normal; text-align:center; }
    .caption .track { animation:none !important; transform:none !important; display:block; }
  }

  .foot { color:var(--tv-foot,var(--tv-fg)); display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; font-size:14px; font-weight:600; }
  .foot-acts { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .foot button { font:inherit; color:var(--tv-button-fg,var(--tv-fg)); background:var(--btn-bg); border:1.5px solid var(--btn-border);
                 border-radius:999px; padding:5px 14px; min-height:32px; cursor:pointer; font-weight:600; }
  .foot button:hover { background:var(--btn-hover); }
  .foot button:focus-visible { outline:3px solid var(--tv-fg); outline-offset:2px; }

/* Critical a11y fallback styles */
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;clip-path:inset(50%)!important;white-space:nowrap!important;border:0!important}
.skip-link{position:fixed;left:12px;top:-80px;z-index:2000;background:#2a1f47;color:#fff;padding:10px 18px;border-radius:8px;font-weight:700;text-decoration:none;border:2px solid #fff;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.skip-link:focus,.skip-link:focus-visible{top:12px;outline:3px solid #5b2fc7;outline-offset:2px}
</style>
<link href="a11y.css" rel="stylesheet"/>
</head>
<body><a class="wcag-skip" href="#wcag-main">ข้ามไปยังเนื้อหาหลัก</a>
<main class="wrap" id="wcag-main" role="main">
<header class="head" data-layout="side" id="head" role="banner">
<img alt="โลโก้ร้านสหกรณ์ มช." class="logo" id="logo" src="logo.png"/>
<div class="txt">
<div class="clock" id="clock">--:--:--</div>
<h1 class="shop" id="shopName"></h1>
<div class="hello"><span id="helloMain"></span> <small id="helloSub"></small></div>
</div>
</header>
<!-- แบนเนอร์ (จัดการรูปที่หน้า Admin) -->
<iframe class="frame" id="banner" loading="eager" src="banner.html" title="แบนเนอร์ประชาสัมพันธ์"></iframe>
<div aria-label="ข้อความประกาศวิ่ง" class="caption" id="caption" role="region"></div>
<!-- ตัวรับสัญญาณเสียงประกาศ/เพลง: ต้องอนุญาตเสียงอัตโนมัติ และกดปุ่มเปิดเสียงที่หน้านี้ 1 ครั้งหลังเปิดหน้าใหม่ -->
<iframe allow="autoplay; fullscreen" class="frame" id="receiver" src="receiver.html" title="ระบบรับสัญญาณเสียงประกาศ"></iframe>
<footer class="foot" role="contentinfo">
<span>CMUCOOP</span>
<div class="foot-acts">
<button aria-label="หยุดข้อความวิ่งชั่วคราว" aria-pressed="false" id="capToggle" type="button"> หยุดข้อความวิ่ง</button>
<button id="copyLink" type="button">คัดลอกลิงก์หน้านี้</button>
</div>
</footer>
</main>
<script>
/* ค่าเริ่มต้น (ใช้ตอนโหลดหน้า/เมื่อติดต่อเซิร์ฟเวอร์ไม่ได้) — ค่าจริงตั้งได้ที่ ระบบหลัก > ตั้งค่า > หน้าจอ TV */
var TEXT = {
  shop:     'ร้านสหกรณ์ มช. (CMU CO-OP)',
  helloMain:'ยินดีต้อนรับ',
  helloSub: '"ขอให้วันนี้เป็นวันที่สดใสสำหรับคุณ"',
  caption:  'ร้านสหกรณ์ มช. ยินดีให้บริการ'
};
var $ = function (id) { return document.getElementById(id); };
/* ข้อความไหล: ข้อความเดียว เริ่มนอกขอบขวา เลื่อนพ้นขอบซ้ายแล้ววนเริ่มใหม่ */
var capText = '', capSpeed = 80, capPaused = false;
function setCaption(t) {
  t = t || '';
  var el = $('caption'), btn = $('capToggle');
  el.style.display = t ? '' : 'none';
  if (btn) btn.style.display = t ? '' : 'none';
  if (t === capText && el.firstChild) return;
  capText = t; el.textContent = '';
  if (!t) return;
  var tr = document.createElement('span'); tr.className = 'track'; tr.textContent = t; el.appendChild(tr);
  el.classList.toggle('paused', capPaused);
  layoutCaption();
}
function layoutCaption() {
  var el = $('caption'), tr = el.firstChild; if (!capText || !tr) return;
  var cw = el.clientWidth || 760, w = tr.getBoundingClientRect().width || 1;
  tr.style.setProperty('--cw', cw + 'px');
  tr.style.setProperty('--dur', ((cw + w) / Math.max(10, capSpeed)).toFixed(2) + 's');
}
$('capToggle').addEventListener('click', function () {
  capPaused = !capPaused;
  $('caption').classList.toggle('paused', capPaused);
  this.setAttribute('aria-pressed', capPaused ? 'true' : 'false');
  this.setAttribute('aria-label', capPaused ? 'เล่นข้อความวิ่งต่อ' : 'หยุดข้อความวิ่งชั่วคราว');
  this.textContent = capPaused ? ' เล่นข้อความวิ่ง' : ' หยุดข้อความวิ่ง';
});
window.addEventListener('resize', layoutCaption);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutCaption);

/* คำนวณสีตัวอักษร (#ffffff หรือ #1f1530) ที่มีความต่าง (contrast ratio) สูงสุดเทียบกับสีพื้นหลังที่ Admin ตั้ง */
function parseColor(str) {
  str = String(str || '').trim();
  var m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(str);
  if (m) {
    var h = m[1];
    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    return { r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16) };
  }
  var rgb = /rgba?\(\s*(\d+)[\s,]+(\d+)[\s,]+(\d+)/.exec(str);
  if (rgb) return { r: +rgb[1], g: +rgb[2], b: +rgb[3] };
  return null;
}
function relLum(c) {
  function ch(v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
  return 0.2126 * ch(c.r) + 0.7152 * ch(c.g) + 0.0722 * ch(c.b);
}
function contrastRatio(l1, l2) {
  return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
}
function syncContrast(bgStr, textColor) {
  var c = parseColor(bgStr) || parseColor(getComputedStyle(document.body).backgroundColor) || { r: 139, g: 99, b: 166 };
  var bgLum = relLum(c);
  var whiteLum = 1.0, darkLum = relLum({ r: 31, g: 21, b: 48 }); // #1f1530
  var rWhite = contrastRatio(whiteLum, bgLum), rDark = contrastRatio(darkLum, bgLum);
  var useDark = rDark > rWhite && rWhite < 4.5;
  var r = document.documentElement.style;
  if (useDark) {
    r.setProperty('--tv-fg', '#1f1530');
    r.setProperty('--tv-shadow', 'none');
    r.setProperty('--btn-bg', 'rgba(255,255,255,.72)');
    r.setProperty('--btn-hover', 'rgba(255,255,255,.9)');
    r.setProperty('--btn-border', 'rgba(31,21,48,.65)');
  } else {
    r.setProperty('--tv-fg', '#ffffff');
    r.setProperty('--tv-shadow', '0 1px 2px rgba(58,32,80,.35)');
    r.setProperty('--btn-bg', 'rgba(26,15,46,.48)');
    r.setProperty('--btn-hover', 'rgba(26,15,46,.68)');
    r.setProperty('--btn-border', 'rgba(255,255,255,.78)');
  }
  // ปุ่มใช้สีที่อ่านง่ายบนพื้นปุ่มเสมอ แม้จะเลือกสีข้อความส่วนอื่นเอง
  r.setProperty('--tv-button-fg', useDark ? '#1f1530' : '#ffffff');
  if (/^#[0-9a-f]{6}$/i.test(String(textColor || ''))) {
    r.setProperty('--tv-fg', textColor);
    r.setProperty('--tv-shadow', 'none');
  }
}

/* โหลดฟอนต์ที่เลือกจาก Google Fonts (Tahoma / TH Sarabun New ใช้ฟอนต์ในเครื่อง) */
var fontLoaded = {};
function useFont(name) {
  if (!name) return;
  document.documentElement.style.setProperty('--font', "'" + name + "'");
  if (fontLoaded[name] || name === 'Tahoma' || name === 'TH Sarabun New' || name === 'Sarabun') return;
  fontLoaded[name] = 1;
  var l = document.createElement('link'); l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(name).replace(/%20/g, '+') + ':wght@400;600;700&display=swap';
  document.head.appendChild(l);
  if (document.fonts && document.fonts.ready) setTimeout(function () { document.fonts.ready.then(layoutCaption); }, 1500);
}
function applyCfg(c) {
  c = c || {};
  var T = function (k) { return c[k] === undefined || c[k] === null ? TEXT[k] : c[k]; };
  $('shopName').textContent = T('shop'); $('shopName').style.display = T('shop') ? '' : 'none';
  $('helloMain').textContent = T('helloMain'); $('helloSub').textContent = T('helloSub');
  $('helloMain').parentNode.style.display = (T('helloMain') || T('helloSub')) ? '' : 'none';
  setCaption(T('caption'));
  var r = document.documentElement.style;
  var bgVal = c.bg || '#8b63a6';
  r.setProperty('--bg', bgVal);
  syncContrast(bgVal, c.textColor);
  [['clockColor','--tv-clock'],['shopColor','--tv-shop'],['welcomeColor','--tv-welcome'],['subColor','--tv-sub'],['captionColor','--tv-caption'],['footColor','--tv-foot']].forEach(function (p) {
    var v = String(c[p[0]] || '');
    if (/^#[0-9a-f]{6}$/i.test(v)) r.setProperty(p[1], v); else r.removeProperty(p[1]);
  });
  if (c.width) r.setProperty('--w', c.width + 'px');
  if (c.bannerH) r.setProperty('--banner-h', c.bannerH + 'px');
  if (c.receiverH) r.setProperty('--receiver-h', c.receiverH + 'px');
  [['fontClock','--f-clock'],['fontShop','--f-shop'],['fontHello','--f-hello'],['fontCaption','--f-caption']].forEach(function (p) {
    if (c[p[0]]) r.setProperty(p[1], c[p[0]] + 'px');
  });
  if (c.gap !== undefined && c.gap !== null) r.setProperty('--gap', c.gap + 'px');
  r.setProperty('--banner-w', Number(c.bannerW) > 0 ? c.bannerW + 'px' : '100%');
  r.setProperty('--receiver-w', Number(c.receiverW) > 0 ? c.receiverW + 'px' : '100%');
  if (c.padTop !== undefined && c.padTop !== null) r.setProperty('--pad-top', c.padTop + 'px');
  if (c.logoSize) r.setProperty('--logo', c.logoSize + 'px');
  if (c.headGap !== undefined && c.headGap !== null) r.setProperty('--head-gap', c.headGap + 'px');
  [['gapBanner','--g-banner'],['gapCaption','--g-caption'],['gapReceiver','--g-receiver'],['gapFoot','--g-foot']].forEach(function (p) {
    var v = c[p[0]]; if (v === null || v === undefined || v === '') r.removeProperty(p[1]); else r.setProperty(p[1], v + 'px');
  });
  useFont(c.font);
  $('head').setAttribute('data-layout', c.headLayout || 'side');
  if (c.capSpeed) capSpeed = Number(c.capSpeed) || 80;
  layoutCaption();
  $('logo').style.display = c.showLogo === false ? 'none' : '';
  $('clock').style.display = c.showClock === false ? 'none' : '';
  $('banner').style.display = c.showBanner === false ? 'none' : '';
}
applyCfg({});
/* ดึงค่าตั้งค่าจากเซิร์ฟเวอร์ แล้วตรวจซ้ำทุก 1 นาที (เปลี่ยนค่าที่ระบบหลักแล้ว TV อัปเดตเอง ไม่ต้องรีเฟรช) */
function loadCfg() {
  if (!window.google || !google.script) return;
  google.script.run.withSuccessHandler(applyCfg).withFailureHandler(function () {}).getTvPublic();
}
loadCfg(); setInterval(function () { if (!document.hidden) loadCfg(); }, 60000);

/* นาฬิกา: เวลาไทย พ.ศ. อัปเดตทุกวินาที */
var TZ = 'Asia/Bangkok';
function tick() {
  var d = new Date();
  var t = d.toLocaleTimeString('en-GB', { hour12: false, timeZone: TZ });
  var day = d.toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric', timeZone: TZ, calendar: 'buddhist' });
  document.getElementById('clock').textContent = t + ' น. ' + day;
}
tick(); setInterval(tick, 1000);

/* คัดลอกลิงก์หน้านี้ */
document.getElementById('copyLink').addEventListener('click', function () {
  var btn = this, url = location.href.split('#')[0], old = btn.textContent;
  function done(ok) { btn.textContent = ok ? 'คัดลอกลิงก์แล้ว ✓' : 'คัดลอกไม่ได้ กรุณาคัดลอกจากแถบที่อยู่'; setTimeout(function () { btn.textContent = old; }, 2000); }
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(url).then(function () { done(true); }, function () { done(false); }); return; }
  var ta = document.createElement('textarea'); ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta); done(ok);
});
</script>
<script src="a11y.js"></script>
</body>
</html>
