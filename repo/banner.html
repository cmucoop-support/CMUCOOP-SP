<!DOCTYPE html>
<html lang="th">
<head>
<link rel="icon" type="image/png" href="logo.png">
<script src="gas-shim.js"></script>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMUCOOP Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#a37bb9;--ink:#2b2234;--per:3;--gap:18px}
@media (max-width:900px){:root{--per:2}}
@media (max-width:560px){:root{--per:1}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 'Sarabun','Noto Sans Thai',Tahoma,sans-serif;padding:clamp(8px,2.5vw,26px)}
.panel{position:relative;max-width:1400px;margin:0 auto;background:#fff;border-radius:18px;padding:clamp(10px,2vw,22px)}
.viewport{overflow:hidden;padding:8px 0 14px;touch-action:pan-y;margin:0 auto}
.track{display:flex;gap:var(--gap);will-change:transform}
.track.few{justify-content:center}
.slide{flex:0 0 var(--sw,calc((100% - (var(--per) - 1) * var(--gap)) / var(--per)));aspect-ratio:var(--ar,3/4);background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(58,32,80,.14);overflow:hidden;display:flex;align-items:center;justify-content:center}
.slide a{display:block;width:100%;height:100%}
.slide img{display:block;width:100%;height:100%;object-fit:contain}
.slide.sk{background:linear-gradient(100deg,#f1ecf5 30%,#faf7fc 50%,#f1ecf5 70%);background-size:200% 100%;animation:sk 1.4s linear infinite;box-shadow:none}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.slide.sk{animation:none}}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.28);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.nav:hover{background:#f3ebf8}
.nav:focus-visible{outline:3px solid #6b3f8c;outline-offset:2px}
.nav.prev{left:6px}.nav.next{right:6px}
.nav[hidden]{display:none}
.msg{padding:48px 12px;text-align:center;color:#6d5f78}
html,body{height:100%;overflow:hidden}
body{padding:0}
.panel{position:absolute;left:8px;right:8px;top:8px;max-width:none;margin:0;padding:12px;display:flex;align-items:center}
.viewport{width:100%;padding:6px 0}
</style>
</head>
<body>
<div class="panel" id="panel">
  <button class="nav prev" id="prev" aria-label="ก่อนหน้า" hidden>&#10094;</button>
  <div class="viewport" id="viewport">
    <div class="track" id="track" aria-live="off">
      <div class="slide sk"></div><div class="slide sk"></div><div class="slide sk"></div>
    </div>
  </div>
  <button class="nav next" id="next" aria-label="ถัดไป" hidden>&#10095;</button>
</div>

<script>
var $ = function (s) { return document.querySelector(s); };
var esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
};
var track = $('#track'), panel = $('#panel');
var timer = null, paused = false, moving = false, count = 0, speed = 4, sig = '', perSet = 0, hPct = 80, ar = 0.75, arSet = false, firstId = '';
var ANIM = 600;
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* วัดขนาดกรอบที่ฝังอยู่จริง แล้วจัดรูปให้เต็มกรอบ: perSet = 0 → เลือกจำนวนรูปที่เต็มกรอบที่สุดเอง, 1-6 → ตามที่แอดมินตั้ง */
var M = 8, PAD = 12, GAP = 18, swPx = 300;
function normH(v) { v = Math.round(Number(v)); return v >= 30 && v <= 100 ? v : 80; }
function normPer(v) { v = Math.round(Number(v)); return v >= 0 && v <= 6 ? v : 0; }
function applyPer() { layout(); }
function layout() {
  var W = window.innerWidth || 800, H = window.innerHeight || 600;
  var availW = Math.max(80, W - 2 * M - 2 * PAD), sh = Math.max(60, (H - 2 * M - 2 * PAD - 12) * hPct / 100);
  function widthFor(k) { return Math.max(40, Math.min((availW - (k - 1) * GAP) / k, sh * ar)); }
  var n = perSet, st = document.documentElement.style;
  if (!n) {
    var best = 0, lim = Math.max(1, Math.min(6, count || 6)); n = 1;
    for (var k = 1; k <= lim; k++) { var c = k * widthFor(k) * widthFor(k); if (c > best + 1) { best = c; n = k; } }
  }
  swPx = Math.floor(widthFor(n));
  st.setProperty('--per', n); st.setProperty('--sw', swPx + 'px'); st.setProperty('--ar', String(ar)); st.setProperty('--gap', GAP + 'px');
  $('#viewport').style.maxWidth = (n * swPx + (n - 1) * GAP) + 'px';
}
function perView() { return Number(getComputedStyle(document.documentElement).getPropertyValue('--per')) || 1; }
function step() { return swPx + GAP; }
function canLoop() { return count > perView(); }

/* หมุนวนไม่รู้จบ: เลื่อนทีละรูป แล้วย้ายรูปแรกไปต่อท้าย (หรือรูปท้ายมาไว้หน้า) */
function go(dir) {
  if (moving || !canLoop()) return;
  var w = step(); if (!w) return;
  moving = true;
  var dur = reduce ? 0 : ANIM;
  function done() {
    track.style.transition = 'none'; track.style.transform = 'none';
    if (dir > 0) track.appendChild(track.firstElementChild);
    moving = false;
  }
  if (dir > 0) {
    if (!dur) return done();
    track.style.transition = 'transform ' + dur + 'ms ease';
    track.style.transform = 'translateX(' + (-w) + 'px)';
    setTimeout(done, dur + 40);
  } else {
    track.insertBefore(track.lastElementChild, track.firstElementChild);
    track.style.transition = 'none'; track.style.transform = 'translateX(' + (-w) + 'px)';
    if (!dur) { track.style.transform = 'none'; moving = false; return; }
    void track.offsetWidth;
    track.style.transition = 'transform ' + dur + 'ms ease';
    track.style.transform = 'translateX(0)';
    setTimeout(function () { track.style.transition = 'none'; moving = false; }, dur + 40);
  }
}
function restart() {
  clearInterval(timer);
  if (!canLoop()) return;
  timer = setInterval(function () { if (!paused && !document.hidden) go(1); }, Math.max(1000, speed * 1000));
}
function updateNav() {
  var on = canLoop();
  $('#prev').hidden = $('#next').hidden = !on;
  track.classList.toggle('few', !on);
}
function render(data) {
  var list = (data && data.banners) || [];
  speed = Number(data && data.speed) || 4;
  perSet = normPer(data && data.perView); hPct = normH(data && data.heightPct);
  sig = JSON.stringify([speed, perSet, hPct, list.map(function (b) { return [b.id, b.link]; })]);
  count = list.length; firstId = count ? list[0].id : ''; arSet = false;
  moving = false; track.style.transition = 'none'; track.style.transform = 'none';
  if (!count) { track.innerHTML = '<div class="msg" style="flex:1">ยังไม่มี Banner</div>'; updateNav(); clearInterval(timer); return; }
  track.innerHTML = list.map(function (b) {
    var im = '<img src="' + esc(b.url) + '" alt="' + esc(b.title) + '" data-id="' + esc(b.id) + '" draggable="false">';
    if (b.link) im = '<a href="' + esc(b.link) + '" target="_blank" rel="noopener">' + im + '</a>';
    return '<div class="slide">' + im + '</div>';
  }).join('');
  layout(); updateNav(); restart();
}
/* อ่านสัดส่วนจริงจากรูปแรก แล้วจัดขนาดช่องใหม่ */
track.addEventListener('load', function (e) {
  var im = e.target;
  if (!im || im.tagName !== 'IMG' || arSet || im.dataset.id !== firstId) return;
  if (im.naturalWidth && im.naturalHeight) { ar = im.naturalWidth / im.naturalHeight; arSet = true; layout(); }
}, true);
/* ถ้ารูปจาก Drive ขึ้นไม่ได้ (โดเมนปิดการแชร์สาธารณะ) ให้ขอผ่านสคริปต์แทน */
track.addEventListener('error', function (e) {
  var im = e.target;
  if (!im || im.tagName !== 'IMG' || im.dataset.fb || typeof google === 'undefined') return;
  im.dataset.fb = '1';
  google.script.run.withSuccessHandler(function (d) { im.src = d; }).withFailureHandler(function () {}).getBannerImage(im.dataset.id);
}, true);

$('#prev').addEventListener('click', function () { go(-1); restart(); });
$('#next').addEventListener('click', function () { go(1); restart(); });
['mouseenter', 'focusin'].forEach(function (ev) { panel.addEventListener(ev, function () { paused = true; }); });
['mouseleave', 'focusout'].forEach(function (ev) { panel.addEventListener(ev, function () { paused = false; }); });

/* ปัดซ้าย/ขวาบนมือถือ */
var tx = null, swiped = false;
$('#viewport').addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; swiped = false; paused = true; }, { passive: true });
$('#viewport').addEventListener('touchend', function (e) {
  paused = false;
  if (tx === null) return;
  var dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 40) { swiped = true; go(dx < 0 ? 1 : -1); restart(); }
}, { passive: true });
$('#viewport').addEventListener('click', function (e) { if (swiped) { e.preventDefault(); e.stopPropagation(); swiped = false; } }, true);

window.addEventListener('resize', function () { applyPer(); updateNav(); restart(); });
applyPer();

/* ดึงรายการใหม่ทุก 60 วินาที: เพิ่ม/ลบรูปหรือเปลี่ยนความเร็วแล้วขึ้นเอง ไม่ต้องรีเฟรช */
function load(first) {
  google.script.run
    .withSuccessHandler(function (d) {
      var s2 = JSON.stringify([Number(d && d.speed) || 4, normPer(d && d.perView), normH(d && d.heightPct), ((d && d.banners) || []).map(function (b) { return [b.id, b.link]; })]);
      if (first || s2 !== sig) render(d);
    })
    .withFailureHandler(function () {
      if (first) track.innerHTML = '<div class="msg" style="flex:1">โหลด Banner ไม่สำเร็จ ลองรีเฟรชหน้านี้อีกครั้ง</div>';
    })
    .getPublicBanners();
}
if (typeof google !== 'undefined' && google.script && google.script.run) {
  load(true);
  setInterval(function () { if (!document.hidden) load(false); }, 60000);
} else {
  track.innerHTML = '<div class="msg" style="flex:1">เปิดหน้านี้ผ่านลิงก์เว็บแอป (?page=banner)</div>';
}
</script>
</body>
</html>
