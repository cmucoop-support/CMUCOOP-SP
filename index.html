<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เมนูหลัก · CMUCOOP SUPPORT</title>
<link rel="icon" type="image/png" href="logo.png">
<script src="gas-shim.js"></script>
<script>function pageUrl(file, fallback){ if (/google(usercontent)?\.com$/.test(location.hostname)) return fallback; return location.origin + location.pathname.replace(/[^\/]*$/, '') + file; }</script>
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --ink:#24193d; --steel:#54496e; --bg:#f5f2fc; --panel:#fff; --line:#d6c8ef; --border-ui:#7e6f9d;
  --accent:#6838e3; --accent-text:#5629c4; --accent-soft:#efe8ff; --ok:#136a3c; --warn:#854d0e; --old:#525f6d; --bad:#b42318;
  --grad:linear-gradient(135deg,#5225c2,#6838e3 60%,#7849f0); --shadow:0 4px 16px rgba(86,41,196,.12); --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Sarabun','Noto Sans Thai',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.skip-link{position:fixed;top:-100px;left:16px;z-index:9999;background:var(--ink);color:#fff;padding:10px 18px;border-radius:0 0 12px 12px;font-weight:700;text-decoration:none;box-shadow:0 4px 16px rgba(0,0,0,.35);transition:top .15s}
.skip-link:focus{top:0;outline:3px solid #ffca28;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
.top :focus-visible,.phead :focus-visible{outline:3px solid #fff;outline-offset:2px}

.hidden{display:none!important}
.muted{color:var(--steel);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.addbar{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label{display:grid;gap:4px;font-size:13.5px;color:var(--ink);font-weight:600}
input[type=text],input[type=search],input[type=password],select{width:100%;border-radius:12px;padding:10px 12px;border:1.5px solid var(--border-ui);background:#fbf9ff;color:var(--ink);min-height:42px}
input:focus,select:focus{border-color:var(--accent-text);outline:3px solid rgba(104,56,227,.25);outline-offset:0}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}

.btn{border:1.5px solid var(--accent);background:var(--accent);color:#fff;border-radius:999px;padding:9px 18px;min-height:42px;font-weight:600;transition:transform .1s,filter .15s;box-shadow:0 2px 8px rgba(104,56,227,.28);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn:active,.mcard:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--accent-text);border-color:var(--border-ui);box-shadow:none}
.btn.ghost:hover{border-color:var(--accent-text);background:var(--accent-soft)}
.btn.danger{background:#fff;border-color:var(--bad);color:var(--bad);box-shadow:none}
.btn.small{min-height:36px;padding:6px 14px;font-weight:600;font-size:14px}
.btn[disabled]{opacity:.55;cursor:not-allowed}

.phead{position:sticky;top:0;z-index:20;background:var(--grad);color:#fff;display:flex;align-items:center;gap:10px 12px;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;border-radius:0 0 22px 22px;box-shadow:0 6px 20px rgba(86,41,196,.28);flex-wrap:wrap}
.phead h1{font-size:18px;margin:0;font-weight:700;flex:1;min-width:200px;letter-spacing:.2px}
.phead .me{font-size:14px;font-weight:500}
.phead .btn.ghost{border-color:rgba(255,255,255,.75);color:#fff;background:rgba(255,255,255,.14)}
.phead .btn.ghost:hover{background:rgba(255,255,255,.24)}

#portal{min-height:100vh;background:linear-gradient(180deg,#ece3ff 0,var(--bg) 320px);animation:pgin .25s ease}
@keyframes pgin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#portal{animation:none}}
.pwrap{max-width:var(--portal-w,760px);margin:0 auto;padding:28px 18px calc(40px + env(safe-area-inset-bottom));display:grid;gap:18px}
.cardrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pwrap h2{margin:0;font-size:22px;font-weight:700;color:var(--ink)}

.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(var(--card-w,240px),100%),1fr));gap:14px}
@media (max-width:360px){.menu{grid-template-columns:1fr}}
.menu.fixcols{grid-template-columns:repeat(var(--card-cols),minmax(0,1fr))}
@media (max-width:520px){.menu.fixcols{grid-template-columns:repeat(var(--card-cols-m),minmax(0,1fr))}}

.mcard{display:flex;align-items:center;justify-content:center;text-align:center;min-height:var(--card-h,96px);padding:20px 22px;border-radius:20px;background:#fff;border:1.5px solid var(--line);box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s,border-color .15s;text-decoration:none;color:inherit;width:100%}
.mcard:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(86,41,196,.22);border-color:var(--accent-text);background:#fff}
.mcard b{display:block;font-size:var(--card-fs,18px);color:var(--accent-text);text-align:center;overflow-wrap:anywhere;line-height:1.35}

.modalwrap{position:fixed;inset:0;background:rgba(20,12,38,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
.modal{background:#fff;border-radius:22px;box-shadow:0 20px 50px rgba(36,25,61,.35);padding:20px 22px;width:min(720px,100%);max-height:92vh;overflow:auto;display:grid;gap:12px;border:1px solid var(--line)}
.modal h3{margin:0;font-size:19px;color:var(--ink)}

.loginwrap{position:fixed;inset:0;background:var(--grad);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
body:not(.locked) .loginwrap{display:none}
body.locked #portal{display:none!important}
.logincard{width:min(380px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:30px 26px;box-shadow:0 20px 50px rgba(36,25,61,.35);display:grid;gap:14px}
.logincard h2{margin:0;text-align:center;font-size:22px;color:var(--accent-text)}
.logincard .btn{width:100%;min-height:46px;font-size:16px}
.err{color:var(--bad);font-size:14px;min-height:20px;font-weight:600}

#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:150;opacity:0;pointer-events:none;transition:opacity .2s;font-weight:600;max-width:92vw;text-align:center}
#toast.show{opacity:1}#toast.err{background:var(--bad)}

@media (max-width:860px){
  .phead{padding-left:14px;padding-right:14px;border-radius:0 0 20px 20px}
  .phead h1{flex:1 1 100%;min-width:0;font-size:17px}
  .phead .me{flex:1 1 100%;font-size:13.5px}
  .phead .btn.small{flex:1 1 auto;padding:6px 12px;min-height:36px;font-size:13.5px}
  .modalwrap{align-items:flex-end;padding:0}
  .modal{width:100%;max-height:90vh;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
  input[type=text],input[type=search],input[type=password],select{font-size:16px}
}
</style>
</head>

<script>
/* ============================ ตัวช่วย ============================ */
var $ = function (s) { return document.querySelector(s); };
var esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
};
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (fn !== 'login' && fn !== 'recoverAdmin' && fn !== 'loginByLink') args.unshift(S.token);
  return new Promise(function (res, rej) {
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) {
      var msg = (e && e.message) || String(e);
      if (/SESSION_EXPIRED/.test(msg)) {
        msg = 'หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบอีกครั้ง';
        showLogin(msg);
      }
      rej(new Error(msg));
    });
    r[fn].apply(r, args);
  });
}
var toastTimer;
function toast(msg, isErr) {
  var t = $('#toast');
  t.setAttribute('role', isErr ? 'alert' : 'status');
  t.textContent = msg; t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.className = ''; }, 3500);
}

/* ============================ สถานะ ============================ */
var S = { token: '', me: null, initSp: '' };
(function initToken() {
  var h = location.hash || '';
  var m = h.match(/[#&]t=([^&]+)/), sp = h.match(/[#&]sp=([^&]+)/);
  if (sp) { try { S.initSp = decodeURIComponent(sp[1]); } catch (e) {} }
  if (m) {
    try { S.token = decodeURIComponent(m[1]); sessionStorage.setItem('pm_tok', S.token); } catch (e) {}
  } else {
    try { S.token = sessionStorage.getItem('pm_tok') || ''; } catch (e) {}
  }
  if (m || sp) {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
})();

/* ============================ เข้าสู่ระบบ / ออกจากระบบ ============================ */
function showLogin(msg) {
  S.token = ''; S.me = null;
  try { sessionStorage.removeItem('pm_tok'); } catch (e) {}
  document.body.classList.add('locked');
  $('#lgErr').textContent = msg || ''; $('#lgPass').value = '';
  setTimeout(function () { $('#lgUser').focus(); }, 50);
}
function hasPerm(k) { if (!S.me) return false; if (S.me.role === 'admin') return true; if (!S.me.perms) return false; return !!S.me.perms[k]; }
function goPortal() {
  var admin = S.me && S.me.role === 'admin';
  $('#pMe').textContent = S.me.name + ' (' + (admin ? 'แอดมิน' : 'ผู้ใช้งาน') + ')';
  $('#mSettings').classList.toggle('hidden', !admin);
  loadCardSize();
  ['barcode:mBarcode', 'sound:mSound', 'music:mMusic', 'stock:mStock', 'market:mMarket'].forEach(function (x) {
    var a = x.split(':'); $('#' + a[1]).classList.toggle('hidden', !hasPerm(a[0]));
  });
}
async function startApp(me) {
  S.me = me;
  if (S.initSp && me.role === 'admin') {
    var sp = S.initSp; S.initSp = '';
    var u = pageUrl('settings.html', 'https://cmucoop-support.github.io/CMUCOOP-SP/settings.html');
    location.href = u + '#sp=' + encodeURIComponent(sp) + '&t=' + encodeURIComponent(S.token);
    return;
  }
  document.body.classList.remove('locked');
  goPortal();
  loadCardOrder();
}

/* ----- ลำดับการ์ดเมนูหลัก (แอดมินจัดได้ในหน้า settings.html) ----- */
var CARD_DEF = [
  { k: 'barcode', id: 'mBarcode', t: 'รายการบาร์เดี่ยว/บาร์แพ็ค' },
  { k: 'sound', id: 'mSound', t: 'ระบบเสียงประกาศ' },
  { k: 'music', id: 'mMusic', t: 'ขอเพลง / คิวเพลง' },
  { k: 'stock', id: 'mStock', t: 'สินค้าค้างสต็อก' },
  { k: 'market', id: 'mMarket', t: 'เช็คราคาตลาด' },
  { k: 'settings', id: 'mSettings', t: 'ตั้งค่า' }
];
var CARD_ORDER = CARD_DEF.map(function (c) { return c.k; });
var CARD_TITLES = {};
var CUSTOM = [];
function customOf(k) { return CUSTOM.filter(function (c) { return c.k === k; })[0]; }
function cardDef(k) { return CARD_DEF.filter(function (c) { return c.k === k; })[0]; }
function cardEl(k) { var d = cardDef(k); return d ? document.getElementById(d.id) : document.querySelector('#portal .mcard[data-ck="' + k + '"]'); }
function applyCardOrder(order) {
  var menu = document.querySelector('#portal .menu');
  order.forEach(function (k) { var el = cardEl(k); if (el) menu.appendChild(el); });
}
function cardTitle(k) { var c = customOf(k); return c ? c.t : (CARD_TITLES[k] || cardDef(k).t); }
function applyCardTitles() {
  CARD_DEF.forEach(function (d) {
    var el = document.getElementById(d.id), b = el && el.querySelector('b');
    if (b) b.textContent = cardTitle(d.k);
  });
}
function renderCustomCards() {
  var menu = document.querySelector('#portal .menu');
  menu.querySelectorAll('.mcard[data-ck]').forEach(function (x) { x.remove(); });
  CUSTOM.forEach(function (c) {
    if (!hasPerm(c.k)) return;
    var a = document.createElement('a'), b = document.createElement('b');
    a.className = 'mcard'; a.dataset.ck = c.k; a.href = c.u;
    b.textContent = c.t; a.appendChild(b); menu.appendChild(a);
  });
}
function refreshCards() { renderCustomCards(); applyCardOrder(CARD_ORDER); applyCardTitles(); }
function loadCardOrder() {
  function ok(fn, def) { return call(fn).catch(function () { return def; }); }
  Promise.all([ok('getCardOrder', CARD_ORDER), ok('getCardTitles', {}), ok('getCustomCards', [])]).then(function (r) {
    CARD_ORDER = Array.isArray(r[0]) ? r[0].slice() : CARD_DEF.map(function (c) { return c.k; });
    CARD_DEF.forEach(function (c) {
      if (CARD_ORDER.indexOf(c.k) < 0) {
        var si = CARD_ORDER.indexOf('settings');
        if (si >= 0) CARD_ORDER.splice(si, 0, c.k); else CARD_ORDER.push(c.k);
      }
    });
    CARD_TITLES = r[1] || {}; CUSTOM = r[2] || [];
    refreshCards();
  });
}

/* ----- บันทึกการใช้งานลงประวัติ ----- */
var USE_LAST = {};
function logUse(area, action, detail) {
  if (!S.token) return;
  var k = area + '|' + action + '|' + (detail || ''), t = Date.now();
  if (USE_LAST[k] && t - USE_LAST[k] < 1500) return;
  USE_LAST[k] = t;
  try {
    if (window.API_URL && navigator.sendBeacon) {
      navigator.sendBeacon(window.API_URL, new Blob([JSON.stringify({ fn: 'logUse', args: [S.token, area, action, detail || ''] })], { type: 'text/plain;charset=utf-8' }));
      return;
    }
    google.script.run.withFailureHandler(function () {}).logUse(S.token, area, action, detail || '');
  } catch (e) {}
}
document.querySelector('#portal .menu').addEventListener('click', function (e) {
  var el = e.target.closest('.mcard'); if (!el) return;
  if (el.dataset.ck) { logUse('card', 'เปิดการ์ด', cardTitle(el.dataset.ck)); return; }
  var d = CARD_DEF.filter(function (c) { return c.id === el.id; })[0];
  if (d) logUse(d.k, 'เปิดการ์ด', cardTitle(d.k));
});

/* ----- ปรับขนาดการ์ดเมนูหลัก ----- */
var SZ_NAMES = ['เล็ก', 'ปกติ', 'กลาง', 'ใหญ่', 'ใหญ่มาก', 'ใหญ่มากๆ'];
var SZ_CARD = [{ w: 190, h: 72 }, { w: 240, h: 96 }, { w: 290, h: 118 }, { w: 340, h: 140 }, { w: 400, h: 170 },
  { w: '100%', h: 'max(180px, calc((100vh - 250px) / 2))', pw: '960px' }];
var SZ_FONT = [14, 18, 22, 26, 30, 36];
var SZ = { c: 1, f: 1, n: 0 };
function szKey() { return 'pm_cardsz2_' + ((S.me && (S.me.user || S.me.name)) || ''); }
function szApply() {
  var st = $('#portal').style, c = SZ_CARD[SZ.c];
  st.setProperty('--card-w', typeof c.w === 'number' ? c.w + 'px' : c.w);
  st.setProperty('--card-h', typeof c.h === 'number' ? c.h + 'px' : c.h);
  st.setProperty('--card-fs', SZ_FONT[SZ.f] + 'px');
  var menu = $('#portal .menu'), base = typeof c.w === 'number' ? c.w : 240;
  if (SZ.n > 0) {
    menu.classList.add('fixcols');
    st.setProperty('--card-cols', SZ.n); st.setProperty('--card-cols-m', Math.min(SZ.n, 2));
    st.setProperty('--portal-w', Math.max(c.pw ? parseInt(c.pw, 10) : 760, SZ.n * base + (SZ.n - 1) * 14 + 40) + 'px');
  } else {
    menu.classList.remove('fixcols');
    st.setProperty('--portal-w', c.pw || Math.max(760, c.w * 2 + 64) + 'px');
  }
}
function szRender() {
  function btns(g, names) {
    return names.map(function (n, i) {
      var on = SZ[g] === i;
      return '<button type="button" class="btn small' + (on ? '' : ' ghost') + '" aria-pressed="' + (on ? 'true' : 'false') + '" data-g="' + g + '" data-i="' + i + '">' + n + '</button>';
    }).join('');
  }
  $('#szCardBtns').innerHTML = btns('c', SZ_NAMES); $('#szFontBtns').innerHTML = btns('f', SZ_NAMES);
  $('#szColBtns').innerHTML = btns('n', ['อัตโนมัติ', '1', '2', '3', '4']);
}
function loadCardSize() {
  SZ = { c: 1, f: 1, n: 0 };
  var hadLocal = false;
  try {
    var o = JSON.parse(localStorage.getItem(szKey()) || 'null');
    if (o && o.c >= 0 && o.c < SZ_NAMES.length && o.f >= 0 && o.f < SZ_NAMES.length) {
      SZ = { c: Number(o.c), f: Number(o.f), n: o.n >= 0 && o.n <= 4 ? Number(o.n) : 0 }; hadLocal = true;
    }
  } catch (e) {}
  szApply();
  call('getCardSize').then(function (v) {
    if (v) {
      SZ = { c: v.c, f: v.f, n: v.n }; szApply();
      try { localStorage.setItem(szKey(), JSON.stringify(SZ)); } catch (e) {}
      if (!$('#sizeModal').classList.contains('hidden')) szRender();
    } else if (hadLocal) call('setCardSize', SZ).catch(function () {});
  }).catch(function () {});
}
var szTimer = null;
function szSave() {
  try { localStorage.setItem(szKey(), JSON.stringify(SZ)); } catch (e) {}
  clearTimeout(szTimer);
  szTimer = setTimeout(function () { call('setCardSize', SZ).catch(function () {}); }, 600);
}
$('#portalSize').addEventListener('click', function () { szRender(); $('#sizeModal').classList.remove('hidden'); $('#sizeClose').focus(); });
$('#sizeModal').addEventListener('click', function (e) {
  if (e.target === $('#sizeModal')) { $('#sizeModal').classList.add('hidden'); $('#portalSize').focus(); return; }
  var b = e.target.closest('button[data-g]'); if (!b) return;
  SZ[b.dataset.g] = Number(b.dataset.i); szApply(); szRender(); szSave();
});
$('#sizeReset').addEventListener('click', function () { SZ = { c: 1, f: 1, n: 0 }; szApply(); szRender(); szSave(); });
$('#sizeClose').addEventListener('click', function () { $('#sizeModal').classList.add('hidden'); $('#portalSize').focus(); });

async function doLogin() {
  var u = $('#lgUser').value.trim(), p = $('#lgPass').value;
  if (!u || !p) { $('#lgErr').textContent = 'กรุณากรอกรหัสผู้ใช้และรหัสผ่าน'; return; }
  $('#lgBtn').disabled = true; $('#lgErr').textContent = '';
  try {
    var r = await call('login', u, p);
    S.token = r.token;
    try { sessionStorage.setItem('pm_tok', r.token); } catch (e) {}
    $('#lgPass').value = '';
    await startApp(r);
  } catch (e) { $('#lgErr').textContent = e.message; $('#lgPass').value = ''; }
  $('#lgBtn').disabled = false;
}
$('#lgBtn').addEventListener('click', doLogin);
$('#lgForgot').addEventListener('click', function (e) {
  e.preventDefault();
  var open = $('#rcBox').classList.toggle('hidden');
  this.setAttribute('aria-expanded', open ? 'false' : 'true');
  if (!open) { $('#rcUser').value = $('#lgUser').value.trim(); $('#rcCode').focus(); }
});
$('#rcBtn').addEventListener('click', async function () {
  this.disabled = true; $('#lgErr').textContent = '';
  try {
    await call('recoverAdmin', $('#rcUser').value.trim(), $('#rcCode').value, $('#rcPass').value);
    $('#lgUser').value = $('#rcUser').value.trim();
    ['#rcCode', '#rcPass'].forEach(function (x) { $(x).value = ''; });
    $('#rcBox').classList.add('hidden');
    $('#lgForgot').setAttribute('aria-expanded', 'false');
    $('#lgErr').textContent = 'ตั้งรหัสผ่านใหม่แล้ว กรุณาเข้าสู่ระบบด้วยรหัสผ่านใหม่';
    $('#lgPass').focus();
  } catch (e) { $('#lgErr').textContent = e.message; }
  this.disabled = false;
});
$('#lgPass').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
$('#lgUser').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#lgPass').focus(); });

function closePw() { $('#pwModal').classList.add('hidden'); ['#pwOld', '#pwNew', '#pwNew2'].forEach(function (x) { $(x).value = ''; }); $('#pwErr').textContent = ''; }
document.querySelectorAll('.js-pw').forEach(function (b) {
  b.addEventListener('click', function () { $('#pwModal').classList.remove('hidden'); $('#pwOld').focus(); });
});
$('#pwCancel').addEventListener('click', closePw);
$('#pwModal').addEventListener('click', function (e) { if (e.target === $('#pwModal')) closePw(); });
async function savePw() {
  var o = $('#pwOld').value, n = $('#pwNew').value;
  if (!o) { $('#pwErr').textContent = 'กรุณากรอกรหัสผ่านเดิม'; return; }
  if (n.length < 4) { $('#pwErr').textContent = 'รหัสผ่านใหม่ต้องมีอย่างน้อย 4 ตัวอักษร'; return; }
  if (n !== $('#pwNew2').value) { $('#pwErr').textContent = 'ยืนยันรหัสผ่านไม่ตรงกัน'; return; }
  $('#pwSave').disabled = true; $('#pwErr').textContent = '';
  try { await call('changePassword', o, n); closePw(); toast('เปลี่ยนรหัสผ่านแล้ว'); }
  catch (e) { $('#pwErr').textContent = e.message; }
  $('#pwSave').disabled = false;
}
$('#pwSave').addEventListener('click', savePw);
$('#pwModal').addEventListener('keydown', function (e) { if (e.key === 'Enter') savePw(); });

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    if (!$('#sizeModal').classList.contains('hidden')) { $('#sizeModal').classList.add('hidden'); $('#portalSize').focus(); }
    if (!$('#pwModal').classList.contains('hidden')) closePw();
  }
});

document.querySelectorAll('.js-logout').forEach(function (b) {
  b.addEventListener('click', async function () {
    try { await call('logout'); } catch (e) {}
    showLogin('');
  });
});

/* ============================ เปิดหน้าการ์ดแยกเป็น URL ใหม่ (รวมถึง settings.html) ============================ */
function openCardPage(file, perm) {
  if (!hasPerm(perm)) return;
  var u = pageUrl(file, 'https://cmucoop-support.github.io/CMUCOOP-SP/' + file);
  location.href = u + '#t=' + encodeURIComponent(S.token);
}
$('#mBarcode').addEventListener('click', function () { openCardPage('barcode.html', 'barcode'); });
$('#mSound').addEventListener('click', function () { openCardPage('sound.html', 'sound'); });
$('#mMusic').addEventListener('click', function () { openCardPage('music.html', 'music'); });
$('#mStock').addEventListener('click', function () { openCardPage('stock.html', 'stock'); });
$('#mMarket').addEventListener('click', function () { openCardPage('market.html', 'market'); });
$('#mSettings').addEventListener('click', function () { openCardPage('settings.html', 'settings'); });

/* ============================ เริ่มต้น ============================ */
function linkParams() {
  return new Promise(function (res) {
    try { google.script.url.getLocation(function (l) { res((l && l.parameter) || {}); }); }
    catch (e) { res({}); }
  });
}
(async function init() {
  var q = await linkParams();
  if (q.u && q.k) {
    try {
      var r = await call('loginByLink', q.u, q.k);
      S.token = r.token;
      try { sessionStorage.setItem('pm_tok', r.token); } catch (e) {}
      await startApp(r); return;
    } catch (e) { showLogin(e.message); return; }
  }
  if (S.token) {
    try { var me = await call('whoami'); await startApp(me); return; } catch (e) {}
  }
  showLogin('');
})();
</script>
